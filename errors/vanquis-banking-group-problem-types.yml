  - code: UK.OBIE.Signature.Missing
    meaning: A required x-jws-signature header is missing.
  - code: UK.OBIE.Signature.MissingClaim
    meaning: A required JWS signature claim is missing.
  - code: UK.OBIE.Signature.Unexpected
    meaning: An unexpected JWS signature was supplied.
  - code: UK.OBIE.UnexpectedError
    meaning: An unexpected server-side error occurred.
  - code: UK.OBIE.Unsupported.AccountIdentifier
    meaning: The account identifier scheme is not supported.
  - code: UK.OBIE.Unsupported.AccountSecondaryIdentifier
