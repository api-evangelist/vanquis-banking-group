apis:
- aid: vanquis-banking-group:vanquis-account-transaction-api
  name: Vanquis Bank Account and Transaction API (AIS)
  description: >-
    Vanquis Bank's OBIE Read/Write Account and Transaction Information API (AISP),
    conformant to the Open Banking Implementation Entity Read/Write Data API
    Standard v3.1.10. Enables authorised Account Information Service Providers to
    access account, balance and transaction data with customer consent, secured
    under the PSD2 / FAPI profile (OAuth2/OIDC, mutual-TLS, SCA). The production
    host is provisioned to each TPP during Open Banking Directory onboarding and
    is not publicly published; the harvested OpenAPI is the shared OBIE standard
    contract Vanquis conforms to, not a Vanquis-proprietary document.
  humanURL: https://www.vanquis.com/developer-portal/
  baseURL: ''
