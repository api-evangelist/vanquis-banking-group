- aid: vanquis-banking-group:vanquis-dynamic-client-registration-api
  name: Vanquis Bank Dynamic Client Registration API
  description: >-
    Vanquis Bank's OpenID / OBIE Dynamic Client Registration (DCR) endpoint,
    documented on the Vanquis developer portal, allowing onboarded Third Party
    Providers to register OAuth clients programmatically using OBIE/eIDAS
    certificates as part of the Open Banking Directory enrolment flow. The
    production host is provisioned per TPP during onboarding and is not publicly
    published; no Vanquis-proprietary OpenAPI is published for this surface.
