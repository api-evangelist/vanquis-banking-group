aid: vanquis-banking-group
url: https://raw.githubusercontent.com/api-evangelist/vanquis-banking-group/refs/heads/main/apis.yml
name: Vanquis Banking Group
kind: company
description: >-
  Vanquis Banking Group plc (formerly Provident Financial plc, rebranded 2023)
  is a UK specialist non-prime lender and savings bank headquartered in Bradford,
  England, listed on the London Stock Exchange under the ticker VANQ and serving
  around 1.75 million customers under the Vanquis, Moneybarn and Snoop brands. It
  offers credit cards, unsecured personal loans, second-charge mortgages, retail
  savings (easy-access, fixed-rate, notice and ISA accounts) and consumer vehicle
  finance to customers underserved by mainstream lenders. Its banking subsidiary,
  Vanquis Bank Limited, is authorised by the Prudential Regulation Authority and
  regulated by the Financial Conduct Authority (Financial Services Register
  no. 221156) and, as an FCA-authorised ASPSP, is a UK Open Banking participant
  (not one of the CMA9). Vanquis exposes the OBIE Read/Write API family - Account
  and Transaction Information (AIS), Payment Initiation (PIS) and Confirmation of
  Funds (CBPII) at v3.1.10 - plus Dynamic Client Registration, onboarded and
  secured through the Open Banking Directory under the PSD2 / FAPI security
  profile (OAuth2/OIDC, mutual-TLS and strong customer authentication). As a
  credit-card and savings specialist with no branch or current-account estate,
  Vanquis publishes no public Open Data (ATM/Branch/PCA/BCA) API.
